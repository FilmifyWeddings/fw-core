name: Remote Dispatch Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: "143.244.133.235"
        username: "root"
        key: ${{ secrets.VPS_SSH_KEY }}
        command_timeout: 30m
        timeout: 60s
        script: |
          cd /var/www/fw-core
          echo "=== DIAGNOSTICS ==="
          pwd
          git status
          pm2 status
          echo "=== PULLING LATEST CODE FIRST ==="
          git fetch origin main
          git reset --hard origin/main
          chmod +x deploy.sh
          ./deploy.sh
